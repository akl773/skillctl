version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - revive

  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    gocritic:
      disabled-checks:
        - ifElseChain

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
      - linters:
          - staticcheck
        text: "SA1019:"

formatters:
  enable:
    - gofmt
    - goimports
